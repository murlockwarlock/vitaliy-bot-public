name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
  workflow_dispatch:
    inputs:
      force_full_ci:
        description: Force the complete SQLite and PostgreSQL suites
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TESTING: "1"
  BOT_TOKEN: ci-test-token
  OWNER_IDS: "999999999"
  ADMIN_IDS: "999999999"

jobs:
  fast-ci:
    name: Fast CI (draft PR)
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && !contains(github.event.pull_request.labels.*.name, 'full-ci') && inputs.force_full_ci != true && inputs.force_full_ci != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: sqlite+aiosqlite:////tmp/ci_fast.db
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch PR base
        run: git fetch origin "${{ github.base_ref }}" --depth=50
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install CI dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Run fast CI
        run: python scripts/run_fast_ci.py

  preflight:
    name: Startup and safety checks
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.draft && !contains(github.event.pull_request.labels.*.name, 'full-ci') && inputs.force_full_ci != true && inputs.force_full_ci != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: sqlite+aiosqlite:////tmp/ci_preflight.db
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install CI dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Startup smoke
        run: python scripts/ci_test_shards.py --run-preflight --preflight-file tests/test_startup_router_smoke.py
      - name: Safety and no-live-Telegram checks
        run: python scripts/ci_test_shards.py --run-preflight --preflight-file tests/test_safety_test_mode.py

  sqlite:
    name: SQLite regression shard ${{ matrix.shard }}/3
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.draft && !contains(github.event.pull_request.labels.*.name, 'full-ci') && inputs.force_full_ci != true && inputs.force_full_ci != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      DATABASE_URL: sqlite+aiosqlite:////tmp/ci_regression_${{ matrix.shard }}.db
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install CI dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Verify exact collection coverage
        if: matrix.shard == 1
        run: python scripts/ci_test_shards.py --verify
      - name: Run SQLite shard
        run: python scripts/ci_test_shards.py --shard ${{ matrix.shard }} --total-shards 3 --run

  postgres:
    name: PostgreSQL 18 MVCC suite
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.draft && !contains(github.event.pull_request.labels.*.name, 'full-ci') && inputs.force_full_ci != true && inputs.force_full_ci != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: sqlite+aiosqlite:////tmp/ci_postgres_support.db
      TEST_POSTGRES_DATABASE_URL: postgresql+asyncpg://postgres:ci-postgres-password@127.0.0.1:5432/vitaliy_test_db
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: vitaliy_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vitaliy_test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install CI dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Verify collection and PostgreSQL registration
        run: python scripts/ci_test_shards.py --verify --audit-postgres
      - name: Run all PostgreSQL MVCC tests
        run: python scripts/ci_test_shards.py --run-postgres

  ci-gate:
    name: CI Gate (fail closed)
    if: always()
    needs:
      - fast-ci
      - preflight
      - sqlite
      - postgres
    runs-on: ubuntu-latest
    env:
      CI_MODE: ${{ (github.event_name == 'pull_request' && github.event.pull_request.draft && !contains(github.event.pull_request.labels.*.name, 'full-ci') && inputs.force_full_ci != true && inputs.force_full_ci != 'true') && 'draft' || 'full' }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Evaluate mandatory check results
        run: python scripts/ci_gate.py "$CI_MODE" "${{ needs.fast-ci.result }}" "${{ needs.preflight.result }}" "${{ needs.sqlite.result }}" "${{ needs.postgres.result }}"
      - name: Build admin navigation map
        if: always()
        env:
          CI_PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          CI_SQLITE_RESULT: ${{ needs.sqlite.result }}
          CI_POSTGRES_RESULT: ${{ needs.postgres.result }}
        run: python scripts/admin_navigation_map.py --output admin-navigation-map.md
      - name: Publish admin navigation map to summary
        if: always()
        run: cat admin-navigation-map.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload admin navigation map artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-navigation-map
          path: admin-navigation-map.md
          if-no-files-found: error
